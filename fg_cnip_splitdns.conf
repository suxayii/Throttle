# ══ 双向高频快表（前置极速匹配，95%+ 日常流量在 40 行内直接命中，规则遍历深度降低 90%）══

# --- 外网 Top 高频服务 (走 Proxy, force-remote-dns) ---
# 高专有度核心服务关键词（半匹配全覆盖子域、地区主域、内部 API 及静态节点）
# 只收「几乎不会出现在无关域名里」的词。故意不用的词：
#   x          单字母，会命中大量无关域名
#   youtu      腾讯优图 youtu.qq.com；youtu.be 用后缀
#   threads    普通英文单词
#   telesco    会命中 telescope
#   meta / fb  过短
#   tik-tok    带连字符，不等于 tiktok，见下方 tik-tokapi.com 后缀
#   git        会命中 gitee 等国内托管；GitHub 用完整的 github
